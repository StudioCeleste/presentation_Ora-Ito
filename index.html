<style>
/* Parti pris : un mur de galerie blanc, une grille d'images qui porte tout,
   un seul signal rouge (le carré), la typographie en très grand corps pour les titres. */
:root{
  --paper:#f6f5f1; --ink:#14130f; --mute:#77746b; --line:#dcd9d0;
  --red:#e2231a; --stage:#12110e; --stage-ink:#f6f5f1;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Fragment Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,3vw,44px)}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 32px;padding-top:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo{height:26px;width:auto;display:block}
.panel .hd .logo{height:18px}
.sq{width:11px;height:11px;border-radius:2.5px;background:var(--red);flex:none}
.top .mono{color:var(--mute)}

.intro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px 64px;align-items:end;padding-top:clamp(36px,6vw,84px);padding-bottom:clamp(28px,4vw,52px)}
.intro h1{font-family:var(--display);font-weight:300;font-size:clamp(44px,8.2vw,128px);line-height:.92;letter-spacing:-.045em;text-wrap:balance}
.intro h1 b{font-weight:700}
.intro p{max-width:44ch;color:var(--mute)}
.intro p strong{color:var(--ink);font-weight:500}

/* Grille */
.grid{padding-top:clamp(20px,3vw,40px);display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(14px,2vw,28px) clamp(12px,1.6vw,24px);padding-bottom:72px}
.tile{grid-column:span 4;display:flex;flex-direction:column;gap:12px;text-align:left}
.tile.wide{grid-column:span 8}
.tile .frame{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--line)}
.tile.wide .frame{aspect-ratio:auto;height:100%;min-height:280px}
.tile .frame>*{position:absolute;inset:0;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile:hover .frame>*,.tile:focus-visible .frame>*{transform:scale(1.035)}
.tile img,.viewer img{object-fit:cover;display:block}
.tile .count{position:absolute;inset:auto 10px 10px auto;width:auto;height:auto;background:var(--paper);padding:4px 7px;transform:none!important}
.tile .cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile h2{font-family:var(--display);font-weight:500;font-size:clamp(20px,2vw,30px);letter-spacing:-.02em;line-height:1.05}
.tile .n{color:var(--red)}
.tile .sub{color:var(--mute);font-size:14px;margin-top:-8px}
.tile:hover h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}

/* Emplacement photo */
.ph{display:flex;align-items:flex-end;padding:12px;background:var(--line);color:var(--mute)}

footer{border-top:1px solid var(--line);padding-top:22px;padding-bottom:36px;display:flex;flex-wrap:wrap;gap:8px 40px;justify-content:space-between;color:var(--mute);font-size:14px}
footer a{color:var(--ink)}
.contact{display:flex;flex-wrap:wrap;gap:4px 20px}
.contact>*{white-space:nowrap}
@media (max-width:700px){.contact{flex-direction:column;gap:4px}}

/* Visionneuse */
.viewer{position:fixed;inset:0;z-index:10;display:none;grid-template-columns:minmax(0,1fr) min(400px,34vw);background:var(--stage)}
.viewer.on{display:grid}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px)}
.slide{position:relative;width:100%;height:100%;overflow:hidden;animation:in .45s ease both}
.viewer .slide img{object-fit:contain}
.slide>*{position:absolute;inset:0;width:100%;height:100%}
@keyframes in{from{opacity:.25;transform:scale(.985)}to{opacity:1;transform:none}}
.nav{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;padding:0 14px;color:var(--stage-ink)}
.nav.prev{left:0;justify-content:flex-start}.nav.next{right:0;justify-content:flex-end}
.nav span{width:42px;height:42px;border:1px solid rgba(246,245,241,.4);border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(18,17,14,.45);opacity:.55;transition:opacity .2s}
.nav:hover span,.nav:focus-visible span{opacity:1}
.bars{position:absolute;left:clamp(12px,3vw,40px);right:clamp(12px,3vw,40px);top:10px;display:flex;gap:4px}
.bars i{flex:1;height:2px;background:rgba(246,245,241,.25)}
.bars i.on{background:var(--stage-ink)}

.panel{background:var(--paper);display:flex;flex-direction:column;min-height:0;overflow:auto}
.panel .hd{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel .hd .brand{font-size:15px}
.close{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 0}
.close:hover{color:var(--red)}
.panel .bd{padding:26px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.panel h3{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.2vw,48px);line-height:.95;letter-spacing:-.035em}
.panel .meta{color:var(--mute)}
.panel .lead{color:var(--mute);font-size:15px}
.panel .lead{margin-top:-8px}
.panel .txt{font-size:15px;line-height:1.55;max-width:44ch}
.panel [hidden]{display:none}
.legend{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.legend .k{color:var(--red)}
.legend p{font-size:17px;line-height:1.45;max-width:38ch}
.todo{color:var(--mute);font-style:italic}
.thumbs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:auto;padding-top:8px}
.thumbs button{position:relative;aspect-ratio:1;overflow:hidden;opacity:.5}
.thumbs button>*{position:absolute;inset:0;width:100%;height:100%;padding:0}
.thumbs button .mono{display:none}
.thumbs button.on{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.panel .ft{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.panel .ft button{font-family:var(--display);font-weight:500;font-size:15px;text-align:left}
.panel .ft button:hover{color:var(--red)}

@media (max-width:900px){
  .intro{grid-template-columns:1fr}
  .tile,.tile.wide{grid-column:span 6}
  .tile.wide .frame{aspect-ratio:4/5;height:auto;min-height:0}
  .viewer{grid-template-columns:1fr;grid-template-rows:minmax(0,58%) minmax(0,1fr)}
}
@media (max-width:520px){.tile,.tile.wide{grid-column:span 12}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const V = n => Array.from({length:n},(_,i)=>({r:i%2?"4/5":"3/2",l:""}));
/* off:true = projet masqué temporairement (retirer off:true pour le réafficher) */
const PROJETS = [
 {id:"mona", titre:"Mona", sous:"Hall Ora Ïto et Daniel Buren", cover:2, texte:"Un hall conçu avec Daniel Buren. Les bandes de marbre blanc et de marbre vert couvrent le mur courbe, descendent au sol et se prolongent jusque sur le parvis. Un bassin longe le mur ; la verrière y projette ses ombres au fil de la journée.", credit:"Photos We Are Contents",

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const el = (t,c,h) => {const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

function media(p, i){
  const ph = p.photos[i];
  if(ph.src){const im=el("img"); im.src=ph.src; im.alt=ph.l||p.titre; return im;}
  return el("div","ph",`<span class="mono">Photo ${pad(i+1)}</span>`);
}

PROJETS.forEach((p,i)=>{
  const b = el("button","tile"+(p.wide?" wide":""));
  b.setAttribute("aria-label",`Ouvrir ${p.titre}`);
  const f = el("div","frame"); const c = media(p,p.cover||0); if(p.pos) c.style.objectPosition = p.pos; f.append(c);
  b.append(f, el("div","cap",`<h2>${p.titre}</h2>`)); if(p.sous) b.append(el("div","sub",p.sous));
  b.onclick = ()=>{ location.hash = p.id; };
  $("grid").append(b);
});

let cur=-1, idx=0, last=null;
function show(){
  const p = PROJETS[cur], ph = p.photos[idx], n = p.photos.length;
  const s = $("slide"); s.style.setProperty("--r",ph.r||"3/2");
  s.replaceChildren(media(p,idx)); s.style.animation="none"; void s.offsetWidth; s.style.animation="";
  $("bars").replaceChildren(...p.photos.map((_,i)=>el("i",i<=idx?"on":"")));
  $("vmeta").textContent = `${pad(cur+1)} / ${pad(PROJETS.length)}`;
  $("vtitle").textContent = p.titre;
  $("vlead").textContent = p.sous||""; $("vlead").hidden = !p.sous;
  $("vtxt").textContent = p.texte||""; $("vtxt").hidden = !p.texte;
  $("vcred").textContent = p.credit||""; $("vcred").hidden = !p.credit;
  $("vk").textContent = `${idx+1} / ${n}`;
  $("vcap").textContent = ph.l||"";
  $("thumbs").replaceChildren(...p.photos.map((_,i)=>{const t=el("button",i===idx?"on":""); t.setAttribute("aria-label",`Photo ${i+1}`); t.append(media(p,i)); t.onclick=()=>{idx=i;show();}; return t;}));
  const a=PROJETS[(cur-1+PROJETS.length)%PROJETS.length], z=PROJETS[(cur+1)%PROJETS.length];
  $("pprev").textContent=`← ${a.titre}`; $("pnext").textContent=`${z.titre} →`;
  $("pprev").onclick=()=>location.hash=a.id; $("pnext").onclick=()=>location.hash=z.id;
}
function step(d){
  const n=PROJETS[cur].photos.length; idx+=d;
  if(idx>=n){location.hash=PROJETS[(cur+1)%PROJETS.length].id;return;}
  if(idx<0) idx=0;
  show();
}
function route(){
  const i = PROJETS.findIndex(p=>p.id===location.hash.slice(1));
  if(i<0){ $("viewer").classList.remove("on"); document.body.style.overflow=""; if(last)last.focus(); cur=-1; return; }
  if(cur<0) last=document.activeElement;
  cur=i; idx=0; $("viewer").classList.add("on"); document.body.style.overflow="hidden"; show(); $("close").focus();
}
function closeV(){ history.replaceState(null,"",location.pathname+location.search); location.hash=""; route(); }
$("next").onclick=()=>step(1); $("prev").onclick=()=>step(-1); $("close").onclick=closeV;
addEventListener("keydown",e=>{ if(cur<0)return;
  if(e.key==="Escape")closeV(); if(e.key==="ArrowRight")step(1); if(e.key==="ArrowLeft")step(-1); });
let x0=null; const st=document.querySelector(".stage");
st.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
st.addEventListener("touchend",e=>{ if(x0==null)return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40)step(dx<0?1:-1); x0=null; });
addEventListener("hashchange",route); route();
</script>
